[package]
name = "halo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
halo-light = { workspace = true }
# Local path so the crate can evolve alongside Halo without publishing.
timestretch = { path = "../../../timestretch-rs" }
# wgpu backend (native Metal on macOS): the default glow backend presents
# through CGLFlushDrawable / OpenGL-on-Metal, which profiled as the single
# biggest CPU cost of the timestretch reference app.
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wgpu",
] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "pcm", "vorbis"] }
egui_extras = { version = "0.31", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
libc = "0.2"
rfd = "0.15"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = { workspace = true }
env_logger = "0.11"

# `cargo install cargo-bundle && cargo bundle --release` builds Halo.app.
[package.metadata.bundle]
name = "Halo"
identifier = "com.robmorgan.halo"
category = "public.app-category.music"
short_description = "Two-deck DJ app powered by the timestretch engine"
osx_minimum_system_version = "12.0"
